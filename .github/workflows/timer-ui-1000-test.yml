name: timer-ui-1000-test
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/stopwatch-http.log 2>&1 &
          sleep 2
      - name: Run 1000 timer operations
        run: node tests/timer-ui-1000.mjs
      - name: Save report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f timer-ui-1000-report.json ]; then
            git add timer-ui-1000-report.json
            git commit -m "[skip ci] timer UI 1000-operation report" || true
            git push || true
          fi
